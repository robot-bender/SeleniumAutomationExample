name: UI and API Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout test automation
        uses: actions/checkout@v4

      - name: Checkout Todo backend
        uses: actions/checkout@v4
        with:
          repository: morosystems/todo-be
          path: backend

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Check Node version
        run: |
          node --version
          npm --version

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Start backend
        working-directory: backend
        run: |
          npm start > backend.log 2>&1 &

      - name: Wait for backend
        run: |
          echo "Waiting for Todo API on localhost:8080..."

          for i in {1..30}; do
            if curl --silent --fail http://localhost:8080/tasks > /dev/null; then
              echo "Backend is ready."
              exit 0
            fi

            echo "Backend is not ready yet..."
            sleep 2
          done

          echo "Backend failed to start."
          echo "Backend log:"
          cat backend/backend.log
          exit 1

      - name: Run API and UI tests
        run: mvn test

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: target/screenshots/
          if-no-files-found: ignore
