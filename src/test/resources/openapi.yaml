name: UI and API Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # Checkout Selenium automation project
      - name: Checkout test automation
        uses: actions/checkout@v4

      # Java for Maven/Selenium tests
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Node.js for the Todo backend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Checkout the backend into ./backend
      - name: Checkout Todo backend
        uses: actions/checkout@v4
        with:
          repository: morosystems/todo-be
          path: backend

      # Install backend dependencies
      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      # Start backend on localhost:8080
      - name: Start backend
        working-directory: backend
        run: npm start > backend.log 2>&1 &

      # Wait until the API is available
      - name: Wait for backend
        run: |
          echo "Waiting for Todo API on localhost:8080..."

          for i in {1..30}; do
            if curl --silent --fail http://localhost:8080/tasks > /dev/null; then
              echo "Backend is ready."
              exit 0
            fi

            echo "Backend is not ready yet..."
            sleep 2
          done

          echo "Backend failed to start."
          echo "Backend log:"
          cat backend/backend.log
          exit 1

      # Run API + UI tests
      - name: Run all tests
        run: mvn test

      # Save screenshots if a UI test fails
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: target/screenshots/
          if-no-files-found: ignore
